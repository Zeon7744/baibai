name: Auto Heat Boost

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  heat-boost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Star Growth
        run: |
          REPO=${{ github.repository }}
          STATS=$(curl -s "https://api.github.com/repos/$REPO" || echo '{}')
          STARS=$(echo "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('stargazers_count',0))")
          echo "Current Stars: $STARS"
          
          if [ "$STARS" -gt 10 ]; then
            echo "🎉 Repository has 10+ stars! Time to boost!"
            gh issue create \
              --title "Star Milestone Reached: $STARS ⭐" \
              --body "Thanks for the support! 🙏" \
              --label "milestone" || true
          fi
      
      - name: Update README Badges
        run: |
          # 更新 Gitee stars badge
          sed -i 's|https://gitee.com/[^/]*/\([^"]*\)/badge/star.svg|https://gitee.com/Zeon7744/'$REPO'/badge/star.svg?theme=gvp|g' README.md 2>/dev/null || true
      
      - name: Generate Share Card
        run: |
          echo "Share this repo:" > share.txt
          echo "- GitHub: https://github.com/${{ github.repository }}" >> share.txt
          echo "- Gitee: https://gitee.com/${GITHUB_REPOSITORY/\/Zeon7744/}" >> share.txt
          cat share.txt
      
      - name: Commit Changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md share.txt
          git diff --staged --quiet || git commit -m "chore: weekly heat boost"
          git push
