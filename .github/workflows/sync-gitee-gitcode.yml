name: Mirror to Gitee and GitCode

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mirror-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          REPO=${{ github.event.repository.name }}
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/Zeon7744/${REPO}.git 2>/dev/null || true
          git push gitee --all --force
          git push gitee --tags --force

  mirror-gitcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          REPO=${{ github.event.repository.name }}
          git remote add gitcode https://oauth2:${GITCODE_TOKEN}@gitcode.com/Zeon7744/${REPO}.git 2>/dev/null || true
          git push gitcode --all --force
          git push gitcode --tags --force
