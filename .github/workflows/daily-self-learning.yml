name: Daily Self-Learning

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  self-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run SEO Check
        run: |
          bash scripts/seo-check.sh .
      
      - name: Run Analysis
        run: |
          bash scripts/analysis.sh . ./analysis
          cat analysis/report.md >> $GITHUB_STEP_SUMMARY
      
      - name: Run Self-Learning
        run: |
          bash scripts/self-learning.sh .
      
      - name: Commit Analysis
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add analysis/
          git add logs/
          git diff --staged --quiet || git commit -m "chore: daily self-learning analysis"
          git push
