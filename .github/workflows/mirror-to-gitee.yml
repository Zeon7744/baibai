name: mirror-to-gitee

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        run: |
          git remote add gitee "https://gitee.com/${GITEE_USER}/${GITEE_REPO}.git"
          git push gitee main --force
          git push gitee develop --force 2>/dev/null || true
          git push gitee 'refs/tags/*' --force 2>/dev/null || true
        env:
          GITEE_USER: Zeon7744
          GITEE_REPO: ${{ github.event.repository.name }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
