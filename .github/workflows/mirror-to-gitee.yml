name: Mirror to Gitee

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mirror-gitee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/Zeon7744/${REPO_NAME}.git 2>/dev/null || true
          git push gitee --all --force
          git push gitee --tags --force

      - name: Notify Success
        if: success()
        run: echo "✅ Successfully mirrored to Gitee"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Failed to mirror to Gitee"
