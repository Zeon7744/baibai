name: Update Content and Sync

on:
  push:
    branches: [main, master]
    paths:
      - '短剧项目/**'
      - 'README.md'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Content
        env:
          AFDIAN_TOKEN: "WTcfMbUpkvFdACswPruY3ySxG87KJ45e"
        run: bash scripts/update-content.sh

      - name: Commit and Push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Zeon7744/baibai.git
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update content and sponsors"
            git push
          fi
