name: Update Content

on:
  push:
    branches: [main, master]
    paths:
      - '短剧项目/**'
      - 'README.md'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Content
        env:
          AFDIAN_TOKEN: "WTcfMbUpkvFdACswPruY3ySxG87KJ45e"
        run: bash scripts/update-content.sh

      - name: Commit Changes
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update content"
          git push || echo "No changes or push failed"
